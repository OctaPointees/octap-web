name: Build Check

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Code formatting (Prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check

  build:
    name: Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        app: [admin, business, landing, internal-sdk]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails when src/generated is out of date with the committed docs/openapi.json
      - name: Generated code matches spec
        if: matrix.app == 'internal-sdk'
        run: |
          npm run generate -w @octap/internal-sdk
          git status --porcelain -- packages/internal/src/generated
          test -z "$(git status --porcelain -- packages/internal/src/generated)"

      - name: Lint
        run: npm run lint -w @octap/${{ matrix.app }} --if-present

      - name: Type check
        run: npm run typecheck -w @octap/${{ matrix.app }} --if-present

      # node:test on Node's own TypeScript support, no browser (the assistant conversation store)
      - name: Unit tests
        if: matrix.app == 'business'
        run: npm test -w @octap/business

      # Confirms the app can actually be bundled
      - name: Build
        run: npm run build -w @octap/${{ matrix.app }} --if-present
