name: Build Check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal-tests:
    name: Portal authentication regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test -w @octap/admin
      - run: npm run test:google-login
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: portal-test-results
          path: test-results/
  build:
    name: Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        app: [admin, business]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint -w @octap/${{ matrix.app }} --if-present

      # Confirms the app can actually be bundled
      - name: Build
        run: npm run build -w @octap/${{ matrix.app }} --if-present
