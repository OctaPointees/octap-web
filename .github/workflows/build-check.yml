name: Build Check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Type-checks using the project references in tsconfig.json
      # (tsconfig.app.json / tsconfig.node.json in the Vite template)
      - name: Type check
        run: npx tsc -b

      # Confirms Vite can actually bundle the app
      - name: Build
        run: npm run build
